        if (dragFrom !== 'pool') return;
        var node = el.poolList.querySelector('.task[data-id="' + dragId + '"]');
        if (!node) return;
        var items = [];
        for (var i = 0; i < el.poolList.children.length; i++) {
          var n = el.poolList.children[i];
          if (n.className.indexOf('task') >= 0) items.push(n);
        }
        var before = items[insertIndex(e.clientY)] || null;
        if (before === node) return;
        if (before) el.poolList.insertBefore(node, before);
        else el.poolList.appendChild(node);
      });

      el.poolList.addEventListener('drop', function (e) {
        if (!dragId) return;
        e.preventDefault();
        var id = dragId;
        if (dragFrom === 'track') {
          var t = getTask(id);
          if (t) t.start = null;
        }
        var idx = insertIndex(e.clientY);
        var all = dayTasks().slice();
        var scheduled = [];
        var pool = [];
        for (var i = 0; i < all.length; i++) {
          if (all[i].id === id) continue;
          if (isPlaced(all[i])) scheduled.push(all[i]);
          else pool.push(all[i]);
        }
        var moved = getTask(id);
        if (moved) {
          moved.start = null;
          if (idx > pool.length) idx = pool.length;
          pool.splice(idx, 0, moved);
        }
        setTasks(pool.concat(scheduled));
        saveStore();
        endDrag();
        render();
        setHint(RANGE_LABEL, false);
      });

      el.poolList.addEventListener('dragleave', function (e) {
        if (e.target === el.poolList) el.poolList.classList.remove('is-drop');
      });

      /* hint and toast */

      function setHint(text, alert) {
        el.placeHint.textContent = text;
        el.placeHint.classList.toggle('is-alert', !!alert);
        if (hintTimer) window.clearTimeout(hintTimer);
        hintTimer = window.setTimeout(function () {
          el.placeHint.textContent = RANGE_LABEL;
          el.placeHint.classList.remove('is-alert');
        }, 2600);
      }

      function toast(text) {
        el.toast.textContent = text;
        el.toast.classList.add('is-open');
        if (toastTimer) window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          el.toast.classList.remove('is-open');
        }, 2400);
      }

      /* reminders */

      var REMIND_HOLD_MS = 5 * 60 * 1000;
      var firedKeys = {};
      var remindQueue = [];
      var remindCurrent = null;
      var remindTimer = null;
      var audioCtx = null;

      function nowMinutes() {
        var d = new Date();
        return d.getHours() * 60 + d.getMinutes();
      }

      function tasksOn(dateStr) {
        var rec = store.days[dateStr];
        if (!rec || Object.prototype.toString.call(rec.tasks) !== '[object Array]') return [];
        return rec.tasks;
      }

      /* 打开页面时，早就过了点的任务不再补提醒，只在"到点"那一刻响一次 */
      function seedFired() {
        var day = todayStr();
        var list = tasksOn(day);
        var now = nowMinutes();
        for (var i = 0; i < list.length; i++) {
          var t = list[i];
          if (isPlaced(t) && t.start <= now - 1) firedKeys[day + '|' + t.id] = true;
        }
      }

      function checkReminders() {
        if (remindCurrent && remindCurrent.done) hideReminder();
        if (!store.settings.remindOn) return;
        var day = todayStr();
        var list = tasksOn(day);
        var now = nowMinutes();
        var due = [];
        for (var i = 0; i < list.length; i++) {
          var t = list[i];
          var key = day + '|' + t.id;
          if (!isPlaced(t) || t.done || firedKeys[key]) continue;
          if (t.start <= now) {
            firedKeys[key] = true;
            due.push(t);
          }
        }
        if (!due.length) return;
        for (var n = 0; n < due.length; n++) remindQueue.push(due[n]);
        if (!remindCurrent) showReminder();
      }

      function showReminder() {
        if (remindCurrent || !remindQueue.length) return;
        var t = remindQueue.shift();
        remindCurrent = t;
        el.remindTitle.textContent = t.title;
        el.remindMeta.textContent = fmtClock(t.start) + '–' + fmtClock(Math.min(DAY_END, t.start + t.dur)) +
          ' · ' + t.cat + ' · ' + fmtDur(t.dur);
        el.remindMute.textContent = store.settings.soundOn ? '静音' : '开声音';
        el.reminder.classList.add('is-open');
        chime();
        if (remindTimer) window.clearTimeout(remindTimer);
        remindTimer = window.setTimeout(hideReminder, REMIND_HOLD_MS);
      }

      function hideReminder() {
        if (remindTimer) {
          window.clearTimeout(remindTimer);
          remindTimer = null;
        }
        el.reminder.classList.remove('is-open');
        remindCurrent = null;
        window.setTimeout(showReminder, 220);
      }

      function renderRemindBtn() {
        el.remindBtn.textContent = store.settings.remindOn ? '提醒：开' : '提醒：关';
        el.remindBtn.classList.toggle('is-on', store.settings.remindOn);
        el.remindBtn.title = store.settings.remindOn ? '任务到点会弹提醒，点击关闭' : '提醒已关闭，点击开启';
      }

      function toggleRemind() {
        store.settings.remindOn = !store.settings.remindOn;
        renderRemindBtn();
        saveStore();
        if (!store.settings.remindOn) {
          remindQueue = [];
          hideReminder();
        }
        toast(store.settings.remindOn ? '任务到点会弹提醒' : '已关闭到点提醒');
      }

      function renderBgBtn() {
        document.body.classList.toggle('no-photo', !store.settings.bgOn);
        el.bgBtn.textContent = store.settings.bgOn ? '背景图：开' : '背景图：关';
        el.bgBtn.classList.toggle('is-on', store.settings.bgOn);
        el.bgBtn.title = store.settings.bgOn ? '正在显示背景图片，点击换成纯色底' : '当前是纯色护眼底，点击显示背景图片';
      }

      function toggleBg() {
        store.settings.bgOn = !store.settings.bgOn;
        renderBgBtn();
        saveStore();
        toast(store.settings.bgOn ? '已显示背景图片' : '已隐藏背景图片');
      }

      function toggleSound() {
        store.settings.soundOn = !store.settings.soundOn;
        el.remindMute.textContent = store.settings.soundOn ? '静音' : '开声音';
        saveStore();
        if (store.settings.soundOn) chime();
      }

      function ensureAudio() {
        if (audioCtx) return audioCtx;
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try {
          audioCtx = new AC();
        } catch (err) {
          audioCtx = null;
        }
        return audioCtx;
      }

      /* 浏览器要先有交互才允许出声，所以第一次点击时把音频上下文唤醒 */
      function unlockAudio() {
        var ctx = ensureAudio();
        if (ctx && ctx.state === 'suspended' && ctx.resume) ctx.resume();
      }

      function tone(ctx, freq, at, len) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, at);
        gain.gain.linearRampToValueAtTime(0.2, at + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + len);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(at);
        osc.stop(at + len + 0.02);
      }

      /* 两声短提示音，升调，不需要任何音频文件 */
      function chime() {
        if (!store.settings.soundOn) return;
        var ctx = ensureAudio();
        if (!ctx) return;
        if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
        var at = ctx.currentTime + 0.02;
        tone(ctx, 880, at, 0.16);
        tone(ctx, 1174.66, at + 0.18, 0.26);
      }

      /* editor */

      function buildSelectors() {
        var durOpts = '';
        for (var i = 0; i < DURS.length; i++) {
          durOpts += '<option value="' + DURS[i] + '">' + fmtDur(DURS[i]) + '</option>';
        }
        el.addDur.innerHTML = durOpts;
        el.edDur.innerHTML = durOpts;
        el.addDur.value = '60';
        var startOpts = '<option value="">不安排时间</option>';
        for (var m = DAY_START; m < DAY_END; m += SLOT_MIN) {
          startOpts += '<option value="' + m + '">' + fmtClock(m) + '</option>';
        }
        el.edStart.innerHTML = startOpts;
      }

      function openEditor(id) {
        var t = getTask(id);
        if (!t) return;
        editingId = id;
        el.edTitle.value = t.title;
        editSubject = t.cat;
        renderSeg(el.edCat, editSubject, editSubject);
        el.edDur.value = String(t.dur);
        el.edStart.value = isPlaced(t) ? String(t.start) : '';
        el.edDone.checked = !!t.done;
        el.edDelete.classList.remove('is-confirm');
        el.edDelete.textContent = '删除';
        el.modal.classList.add('is-open');
        el.edTitle.focus();
        el.edTitle.select();
      }

      function closeEditor() {
        editingId = null;
        el.modal.classList.remove('is-open');
      }

      el.editForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var t = getTask(editingId);
        if (!t) return;
        var title = el.edTitle.value.trim();
        if (!title) return;
        var cat = editSubject;
        ensureCat(cat);
        t.title = title;
        t.cat = cat;
        t.dur = Number(el.edDur.value) || 60;
        t.done = el.edDone.checked;
        var want = el.edStart.value === '' ? null : Number(el.edStart.value);
        if (want === null) {
          t.start = null;
        } else {
          var slot = resolveSlot(occupancy(t.id), Math.round((want - DAY_START) / SLOT_MIN), slotsOf(t), t.id);
          t.start = slot === null ? null : DAY_START + slot * SLOT_MIN;
          if (slot === null) toast('时间轴放不下，已移回待安排');
          else if (t.start !== want) toast('该时段已被占用，已挪到最近的空位');
        }
        saveStore();
        closeEditor();
        render();
      });

      el.edCancel.addEventListener('click', closeEditor);

      el.edDelete.addEventListener('click', function () {
        if (!editingId) return;
        var id = editingId;
        confirmRemove(el.edDelete, function () {
          closeEditor();
          removeTask(id);
        });
      });

      el.modal.addEventListener('mousedown', function (e) {
        if (e.target === el.modal) closeEditor();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          if (el.modal.classList.contains('is-open')) closeEditor();
          else endDrag();
        }
      });

      /* form */

      el.addForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var title = el.addTitle.value.trim();
        if (!title) return;
        var cat = addSubject;
        ensureCat(cat);
        addTask(title, cat, Number(el.addDur.value) || 60);
        el.addTitle.value = '';
        el.addTitle.focus();
      });

      /* persistent todos */

      el.todoForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = el.todoInput.value.trim();
        if (!text) return;
        addTodo(text);
        el.todoInput.value = '';
        el.todoInput.focus();
      });

      el.todoInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          if (el.todoForm.reportValidity()) el.todoForm.requestSubmit();
        }
      });

      el.todoList.addEventListener('click', function (e) {
        var button = e.target.closest('[data-todo-act]');
        if (!button) return;
        var itemNode = button.closest('.todo-item');
        if (!itemNode) return;
        var id = itemNode.getAttribute('data-id');
        var action = button.getAttribute('data-todo-act');

        if (action === 'edit') {
          editingTodoId = id;
          renderTodos();
          var editor = el.todoList.querySelector('.todo-edit-form textarea');
          if (editor) {
            editor.focus();
            editor.setSelectionRange(editor.value.length, editor.value.length);
          }
        } else if (action === 'cancel') {
          editingTodoId = null;
          renderTodos();
        } else if (action === 'delete') {
          confirmRemove(button, function () { removeTodo(id); });
        }
      });

      el.todoList.addEventListener('change', function (e) {
        var box = e.target.closest('[data-todo-done]');
        if (!box) return;
        var itemNode = box.closest('.todo-item');
        var todo = itemNode ? getTodo(itemNode.getAttribute('data-id')) : null;
        if (!todo) return;
        todo.done = box.checked;
        todo.updatedAt = Date.now();
        saveStore();
        renderTodos();
      });

      el.todoList.addEventListener('submit', function (e) {
        var form = e.target.closest('.todo-edit-form');
        if (!form) return;
        e.preventDefault();
        var todo = getTodo(form.getAttribute('data-id'));
        var text = form.querySelector('textarea').value.trim();
        if (!todo || !text) return;
        todo.text = text;
        todo.updatedAt = Date.now();
        editingTodoId = null;
        saveStore();
        renderTodos();
      });

      el.todoList.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' || (!e.ctrlKey && !e.metaKey)) return;
        var form = e.target.closest('.todo-edit-form');
        if (!form) return;
        e.preventDefault();
        if (form.reportValidity()) form.requestSubmit();
      });

      /* date nav */

      el.prevDay.addEventListener('click', function () { viewDate = shiftDate(viewDate, -1); render(); });
      el.nextDay.addEventListener('click', function () { viewDate = shiftDate(viewDate, 1); render(); });
      el.todayBtn.addEventListener('click', function () { viewDate = todayStr(); render(); });

      el.viewBtn.addEventListener('click', function () {
        setView(currentView === 'calendar' ? 'timeline' : 'calendar', true);
      });

      el.calendar.addEventListener('click', function (e) {
        var btn = e.target.closest('.cal-day[data-date]');
        if (!btn) return;
        viewDate = btn.getAttribute('data-date');
        render();
        setView('timeline', true);
      });

      el.fileBtn.addEventListener('click', openFileModal);
      el.fileBindBtn.addEventListener('click', bindDataFolder);
      el.fileLoadBtn.addEventListener('click', loadDataFileFromDisk);
      el.fileCancel.addEventListener('click', closeFileModal);
      el.fileModal.addEventListener('mousedown', function (e) {
        if (e.target === el.fileModal) closeFileModal();
      });

      /* export and import */

      el.exportBtn.addEventListener('click', function () {
        var blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'kaoyan-plan-' + todayStr() + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        toast('已导出备份文件');
      });

      el.importBtn.addEventListener('click', function () { el.importFile.click(); });

      el.importFile.addEventListener('change', function () {
        var file = el.importFile.files && el.importFile.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(String(reader.result));
            if (!parsed || typeof parsed !== 'object' || !parsed.days) throw new Error('bad');
            if (!window.confirm('导入会覆盖当前的全部计划，确定继续吗？')) {
              el.importFile.value = '';
              return;
            }
            applyParsedData(parsed, true);
            saveStore();
            renderBgBtn();
            renderRemindBtn();
            render();
            syncView();
            toast('导入完成');
          } catch (err) {
            toast('这个文件读不出来，请确认是导出的 JSON');
          }
          el.importFile.value = '';
        };
        reader.readAsText(file);
      });

      /* reminder wiring */

      el.remindOk.addEventListener('click', hideReminder);
      el.remindMute.addEventListener('click', toggleSound);
      el.remindBtn.addEventListener('click', toggleRemind);
      el.bgBtn.addEventListener('click', toggleBg);
      document.addEventListener('pointerdown', unlockAudio, true);

      /* boot */

      loadStore();
      buildSelectors();
      renderSeg(el.addCat, addSubject, addSubject);
      if (storageBlocked) markStorageBlocked();
      renderGutter();
      renderRemindBtn();
      renderBgBtn();
      render();
      syncView();
      renderNow();
      scrollToNow();
      seedFired();
      checkReminders();
      restoreDataFile();
      window.setInterval(function () {
        renderNow();
        checkReminders();
      }, 30000);
    })();
  </script>
</body>

</html>
